[telegram]
bot_token_env = "TELEGRAM_BOT_TOKEN"
bot_username = "telellm_bot"
# Replace with the Telegram group or DM IDs allowed to use this daemon.
# Empty means every chat that reaches the bot is allowed.
allowed_chat_ids = [-1001234567890]

[telegram_ux]
queue_ack_enabled = true
typing_indicator_enabled = true
typing_refresh_secs = 4
typing_for_queued_items = true
streaming_enabled = true
streaming_mode = "edit_message"
streaming_update_interval_millis = 1500
streaming_min_delta_chars = 80
streaming_max_chars = 3900
# Use "plain" by default. "markdown_v2" and "html" are available when the
# model output is escaped or explicitly authored for Telegram formatting.
formatting_mode = "plain"
formatting_escape = true
formatting_fallback_to_plain = true

[attachments]
enabled = true
workspace_dir = "telegram_uploads"
max_file_bytes = 20000000

[outputs]
enabled = true
workspace_dir = "telegram_outputs"
max_file_bytes = 20000000
max_files_per_response = 4

[audio]
enabled = true
replies_enabled = true
workspace_dir = "telegram_audio"
max_file_bytes = 20000000

[audio.stt]
command = "whisper-cli"
args = ["--model", "/models/ggml-base.en.bin", "--file", "{input}", "--output-txt", "{output}"]
timeout_secs = 120

[audio.tts]
command = "piper"
args = ["--model", "/models/en_US-lessac-medium.onnx", "--output_file", "{output}"]
stdin_text = true
timeout_secs = 120
send_as = "audio"

[url_ingestion]
enabled = true
workspace_dir = "web_pages"
max_urls_per_message = 3
max_fetch_bytes = 2000000
timeout_secs = 20
user_agent = "telellm/0.1"

[prompt]
system_prompt = """
You are the Telegram group assistant for this chat.
Respond only to the triggering message. Use recent chat and memory as context.
"""

[storage]
sqlite_path = "data/telellm.sqlite"

[docker]
image = "telellm-sandbox:local"
network = "telellm_public"
workspace_volume_prefix = "telellm_workspace"

[codex]
command = "codex"
args = ["exec", "--sandbox", "danger-full-access", "--skip-git-repo-check"]
model = "gpt-5-codex"
# Broker API key mode is the default and keeps the upstream provider key on the host.
auth_mode = "broker_api_key"
# To use a ChatGPT/Codex subscription login instead, run `codex login --device-auth`
# on the host, then use:
# auth_mode = "chatgpt_oauth"
# auth_host_path = "/absolute/path/to/.codex/auth.json"

# Required only when codex.auth_mode is "broker_api_key".
[broker]
listen = "127.0.0.1:8189"
public_base_url = "http://host.docker.internal:8189/v1"
upstream_base_url = "https://api.openai.com/v1"
upstream_api_key_env = "OPENAI_API_KEY"

[limits]
per_group_queue_depth = 16
telegram_chunk_chars = 3900
recent_buffer_messages = 200
codex_first_byte_timeout_secs = 300
codex_inactivity_secs = 600
codex_max_turn_secs = 900
codex_max_output_bytes = 524288
broker_max_requests_per_window = 120
broker_rate_limit_window_secs = 60
broker_max_concurrent_requests = 4
