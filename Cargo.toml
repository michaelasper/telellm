[package]
name = "telellm"
version = "0.1.0"
edition = "2024"
description = "Telegram group chat bridge for sandboxed Codex CLI sessions"
license = "MIT"
repository = "https://github.com/michaelasper/telellm"
readme = "README.md"
keywords = ["telegram", "codex", "sandbox", "openai"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
axum = "0.8.9"
clap = { version = "4.6.1", features = ["derive"] }
portable-pty = "0.9.0"
rand = "0.10.1"
reqwest = { version = "0.13.4", features = ["json", "rustls"] }
scraper = "0.26.0"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
teloxide = { version = "0.17.0", features = ["macros"] }
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["full"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[lints.rust]
future_incompatible = "warn"
nonstandard_style = "deny"

[lints.clippy]
all = { level = "deny", priority = 10 }
redundant_clone = { level = "deny", priority = 9 }
clone_on_copy = { level = "deny", priority = 9 }
large_enum_variant = { level = "deny", priority = 8 }
needless_collect = { level = "deny", priority = 8 }
manual_ok_or = { level = "deny", priority = 8 }
